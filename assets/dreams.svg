<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="t">
  <title id="t">Two dreams: Medicine and Cloud Security</title>
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fab"/><stop offset="1" stop-color="#c8b6ff"/></linearGradient>
    <linearGradient id="b2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8b6ff"/><stop offset="1" stop-color="#ff8fab"/></linearGradient>
    <linearGradient id="cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5f8"/><stop offset="1" stop-color="#f6ecff"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#fb6f92" flood-opacity="0.3"/></filter>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .beat{transform-origin:82px 80px;animation:beat 2.4s ease-in-out infinite}
      @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
      .glow{animation:gl 3s ease-in-out infinite}
      @keyframes gl{0%,100%{opacity:.6}50%{opacity:1}}
    </style>
  </defs>
  <rect x="14" y="10" width="424" height="200" rx="24" fill="url(#cb)" stroke="url(#b1)" stroke-width="3" filter="url(#sh)"/>
  <circle cx="82" cy="110" r="46" fill="#ffe5ec"/>
  <g transform="translate(20 28)">
    <g class="beat">
      <path d="M62 112 C20 84 22 52 44 50 C54 49 60 55 62 60 C64 55 70 49 80 50 C102 52 104 84 62 112 Z" fill="#ff8fab" stroke="#fb6f92" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <path d="M36 80 H52 L57 68 L66 92 L71 80 H88" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="150" y="88" class="serif" font-size="28" font-style="italic" fill="#3d1a3a">Medicine</text>
  <line x1="150" y1="100" x2="210" y2="100" stroke="#fb6f92" stroke-width="2" stroke-linecap="round"/>
  <text x="150" y="130" class="sans" font-size="15" fill="#5a3358">Dreaming of caring for</text>
  <text x="150" y="152" class="sans" font-size="15" fill="#5a3358">people as a doctor</text>
  <rect x="462" y="10" width="424" height="200" rx="24" fill="url(#cb)" stroke="url(#b2)" stroke-width="3" filter="url(#sh)"/>
  <circle cx="530" cy="110" r="46" fill="#efe6ff"/>
  <g transform="translate(468 30)">
    <path d="M62 14 L98 28 V62 C98 86 82 100 62 108 C42 100 26 86 26 62 V28 Z" fill="#c8b6ff" stroke="#7b5cc9" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M42 68 a8 8 0 0 1 2-15 a12 12 0 0 1 22-4 a10 10 0 0 1 14 19 z" fill="#fff" opacity="0.95"/>
    <g class="glow"><rect x="55.5" y="63" width="13" height="11" rx="2" fill="#7b5cc9"/><path d="M58.5 63 v-3 a3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="#7b5cc9" stroke-width="2.2" stroke-linecap="round"/></g>
  </g>
  <text x="598" y="88" class="serif" font-size="28" font-style="italic" fill="#3d1a3a">Cloud Security</text>
  <line x1="598" y1="100" x2="658" y2="100" stroke="#9b7be0" stroke-width="2" stroke-linecap="round"/>
  <text x="598" y="130" class="sans" font-size="15" fill="#5a3358">Designing cloud systems that</text>
  <text x="598" y="152" class="sans" font-size="15" fill="#5a3358">are secure from the very first line</text>
</svg>
