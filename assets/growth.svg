<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-labelledby="t">
  <title id="t">Always learning, always growing: Learn, Practise, Build, Grow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe5ec"/><stop offset="1" stop-color="#efe6ff"/></linearGradient>
    <linearGradient id="vn" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="790" y2="0"><stop offset="0" stop-color="#ff8fab"/><stop offset="1" stop-color="#9b7be0"/></linearGradient>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
                  .halo{transform-box:fill-box;transform-origin:center;animation:hl 3s ease-in-out infinite}
      @keyframes hl{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.8);opacity:0}}
      .lf{transform-box:fill-box;transform-origin:center;animation:sw 4s ease-in-out infinite}
      @keyframes sw{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
    </style>
  </defs>
  <rect width="900" height="140" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="136" rx="22" fill="none" stroke="#ffc2d1" stroke-width="2"/>
  <text x="450" y="36" text-anchor="middle" class="serif" font-size="22" font-style="italic" fill="#3d1a3a">Always learning, always growing</text>
  <path d="M110 82 C170 62 230 100 290 82 S440 62 520 82 S690 100 790 78" fill="none" stroke="url(#vn)" stroke-width="3.5" stroke-linecap="round"/>
  <g class="lf" fill="#ffc2d1" stroke="#fb6f92" stroke-width="1.2">
    <ellipse cx="200" cy="68" rx="9" ry="4.5" transform="rotate(-35 200 68)"/>
    <ellipse cx="400" cy="68" rx="9" ry="4.5" transform="rotate(-30 400 68)"/>
    <ellipse cx="650" cy="94" rx="9" ry="4.5" transform="rotate(30 650 94)"/>
  </g>
  <g ><circle cx="110" cy="82" r="9" fill="#fff" stroke="#fb6f92" stroke-width="3"/></g>
  <g ><circle cx="290" cy="82" r="9" fill="#fff" stroke="#ff8fab" stroke-width="3"/></g>
  <g ><circle cx="520" cy="82" r="9" fill="#fff" stroke="#c8b6ff" stroke-width="3"/></g>
  <g ><circle cx="790" cy="78" r="9" fill="#fb6f92" stroke="#fff" stroke-width="3"/></g>
  <g fill="#fb6f92">
    <circle class="halo" cx="110" cy="82" r="9" style="animation-delay:0s"/><circle class="halo" cx="290" cy="82" r="9" style="animation-delay:.7s"/>
    <circle class="halo" cx="520" cy="82" r="9" style="animation-delay:1.4s"/><circle class="halo" cx="790" cy="78" r="9" style="animation-delay:2.1s"/>
  </g>
  <circle r="4.5" fill="#fff" stroke="#fb6f92" stroke-width="2"><animateMotion dur="7s" repeatCount="indefinite" path="M110 82 C170 62 230 100 290 82 S440 62 520 82 S690 100 790 78"/></circle>
  <g class="sans" font-size="14" font-weight="600" fill="#5a3358" text-anchor="middle" letter-spacing="1">
    <text x="110" y="118">LEARN</text><text x="290" y="118">PRACTISE</text><text x="520" y="118">BUILD</text><text x="790" y="118">GROW</text>
  </g>
</svg>
